name: Flutter toolchain
description: Install pinned Flutter and optional Android tools without credentials or shared caches.
inputs:
  android:
    description: Install Android build dependencies
    default: 'false'
runs:
  using: composite
  steps:
    - name: Reserve disk space for Android native libraries
      if: ${{ inputs.android == 'true' && runner.os == 'Linux' && runner.environment == 'github-hosted' }}
      shell: bash
      run: |
        set -euo pipefail
        if [[ "${GITHUB_ACTIONS:-}" != true || "${RUNNER_ENVIRONMENT:-}" != github-hosted || "${RUNNER_OS:-}" != Linux ]]; then
          echo 'Skipping disk preparation outside a GitHub-hosted Linux runner.'
          exit 0
        fi
        df -h "$GITHUB_WORKSPACE"
        # Fixed installation roots from actions/runner-images Ubuntu build
        # scripts: install-dotnetcore-sdk, install-haskell, install-swift,
        # install-codeql-bundle. None are used by this Android build job.
        sudo rm -rf -- /usr/share/dotnet /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL
        df -h "$GITHUB_WORKSPACE"
        available_kib=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 {print $4}')
        if [[ ! "$available_kib" =~ ^[0-9]+$ ]] || (( available_kib < 25 * 1024 * 1024 )); then
          echo '::error::Android builds require at least 25 GiB free before toolchain installation.'
          exit 1
        fi
    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        # Adoptium's SemVer for JDK 17.0.20.1+1 (JEP 322 patch release).
        java-version: '17.0.20+101'
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        flutter-version: '3.47.1'
        channel: stable
        cache: false
    - if: ${{ inputs.android == 'true' }}
      uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
      with:
        toolchain: '1.96.0'
        targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
    - name: Initialize Android command-line tools
      if: ${{ inputs.android == 'true' }}
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      with:
        cmdline-tools-version: '15859902'
        log-accepted-android-sdk-licenses: 'false'
    - name: Install Android SDK components
      if: ${{ inputs.android == 'true' }}
      shell: bash
      # Google publishes API 37 as android-37.0; android-37 is not a
      # repository package even though Gradle's compileSdk is the integer 37.
      run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;28.2.13676358'

changelog:
  categories:
    - title: "🚀 New Features"
      labels:
        - feature
        - enhancement
    - title: "🐛 Bug Fixes"
      labels:
        - bug
        - fix
    - title: "⚡ Improvements"
      labels:
        - improvement
        - performance
        - refactor
    - title: "🔒 Security"
      labels:
        - security
    - title: "🌍 Translations"
      labels:
        - translations
        - i18n
    - title: "🔧 Maintenance"
      labels:
        - chore
        - ci
        - dependencies
  exclude:
    labels:
      - skip-changelog

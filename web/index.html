  <style id="splash-screen-style">
    /* The page is exactly the visible window and never scrolls itself:
       the Flutter view fills it, so the floating bar at its foot is
       always inside the viewport (a body taller than the window, by
       min-height or a leftover splash, pushed it under the edge). */
    html {
      height: 100%;
      overflow: hidden;
    }

    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      /* Kute's splash, as on iOS and Android: Sal on white, on black in
         dark mode (pubspec flutter_native_splash colours). */
      background-color: #FFFFFF;
      background-size: 100% 100%;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #000000;
      }
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
  </style>
